<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del Usuario</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" href="../../static/css/main.css">

</head>
<body>

<!-- HEADER -->
<nav class="navbar navbar-global d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <i class="bi bi-eye fs-3 me-2" role="img" aria-label="ícono de ojo"></i>
        <span class="brand-text">Panel del Usuario</span>
    </div>

    <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
</nav>

<!-- CONTENIDO -->
<div class="container py-4">

    <div class="row g-4">

        <div class="col-md-4">
            <div class="metric-card text-center">
                <p class="fw-semibold fs-5 mb-1">Promedio Fatiga Inicial</p>
                <p class="fw-bold fs-1 text-warning">64%</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="metric-card text-center">
                <p class="fw-semibold fs-5 mb-1">Promedio Fatiga Final</p>
                <p class="fw-bold fs-1" style="color:#652DFF;">23%</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="metric-card text-center">
                <p class="fw-semibold fs-5 mb-1">Promedio Reducción</p>
                <p class="fw-bold fs-1 text-success">40%</p>
            </div>
        </div>

    </div>

    <!-- HISTORIAL -->
    <div class="dashboard-box mt-5">
        <h4 class="fw-bold mb-3">Historial de Sesiones</h4>

        <div class="table-responsive">
            <table class="table table-hover text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Fecha</th>
                        <th>Fatiga Inicial</th>
                        <th>Fatiga Final</th>
                        <th>Reducción</th>
                        <th>Detalle</th>
                    </tr>
                </thead>

                <tbody id="tablaHistorial">
                    <tr>
                        <td>21/02/2025</td>
                        <td>72%</td>
                        <td>45%</td>
                        <td>37%</td>
                        <td><button class="btn btn-outline-primary btn-sm">Ver</button></td>
                    </tr>

                    <tr>
                        <td>21/02/2025</td>
                        <td>68%</td>
                        <td>36%</td>
                        <td>47%</td>
                        <td><button class="btn btn-outline-primary btn-sm">Ver</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ACTIVIDADES -->
    <div class="center-container">
    <a href="medicion_fatiga.html?tipo=inicial" class="text-decoration-none">
        <button class="btn-actividades">Iniciar Actividades</button>
    </a>
</div>

</div>

<script src="../../static/js/session.js"></script>
<script> protegerRuta("usuario"); </script>

</body>
</html>
