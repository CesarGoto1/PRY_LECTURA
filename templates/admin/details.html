<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalles de Sesión</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../../static/css/main.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-global d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
        <span class="brand-icon">📊</span>
        <span class="brand-text">Detalle de Sesión</span>
    </div>

    <button class="btn-logout" onclick="cerrarSesion()">Cerrar sesión</button>
</nav>

<div class="container mt-4 mb-5">

    <button class="btn btn-outline-primary mb-3" onclick="history.back()">← Regresar</button>

    <div class="dashboard-box">
        <h3 class="fw-bold">Análisis Detallado</h3>
        <p class="text-muted">Comparación de los parámetros medidos</p>

        <div class="row mt-4">

            <div class="col-md-6">
                <h6 class="text-muted mb-2 fw-bold">PERCLOS</h6>
                <canvas id="chartPerclos"></canvas>
            </div>

            <div class="col-md-6">
                <h6 class="text-muted mb-2 fw-bold">Frecuencia de Parpadeo</h6>
                <canvas id="chartParpadeos"></canvas>
            </div>

            <div class="col-md-6 mt-4">
                <h6 class="text-muted mb-2 fw-bold">Velocidad Ocular</h6>
                <canvas id="chartVelocidad"></canvas>
            </div>

            <div class="col-md-6 mt-4">
                <h6 class="text-muted mb-2 fw-bold">Nivel Subjetivo KSS</h6>
                <canvas id="chartKSS"></canvas>
            </div>

        </div>

        <div class="alert mt-4" id="estadoFatiga"></div>

    </div>
</div>

<footer class="mt-auto text-center py-3" style="background:#ffffff55;">
    © 2025 - Sistema de Monitoreo de Fatiga Visual
</footer>

<script src="/static/js/config.js"></script>
<script src="/static/js/session.js"></script>
<script src="/static/js/details.js"></script>

</body>
</html>
